[project]
name = "jobagent"
version = "0.1.0"
description = "Daily job search, scoring, tailoring and form-filling assistant"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pypdf>=4.2",
    "httpx>=0.27",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "playwright>=1.45",
    "google-api-python-client>=2.202.0",
    "google-auth-oauthlib>=1.5.0",
    "boto3[crt]>=1.44.5",
]

[dependency-groups]
dev = ["pytest>=8.2"]

[project.scripts]
jobagent = "jobagent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["always_boards: run search with the big employers checked every day"]
